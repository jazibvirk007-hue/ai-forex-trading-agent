[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tj-trading-os"
version = "0.2.0"
description = "Live-first, risk-gated AI trading OS with MT5, multi-provider AI and Fish Audio voice"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.9,<1",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
live = ["MetaTrader5==5.0.6231"]
ml = ["lightgbm>=4.5,<5"]
deep = ["torch>=2.4,<3"]
db = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1", "mypy>=1.11,<2"]
all = ["tj-trading-os[ml,deep,db,dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
