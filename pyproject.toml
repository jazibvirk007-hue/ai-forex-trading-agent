[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-forex-trading-agent"
version = "0.1.0"
description = "Risk-first forex research, backtesting, paper trading and execution framework"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scipy>=1.13,<2",
  "scikit-learn>=1.5,<2",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
ml = ["lightgbm>=4.5,<5"]
deep = ["torch>=2.4,<3"]
db = ["SQLAlchemy>=2.0,<3", "psycopg[binary]>=3.2,<4"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1", "mypy>=1.11,<2"]
all = ["ai-forex-trading-agent[ml,deep,db,dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.setuptools.packages.find]
include = ["app*"]
